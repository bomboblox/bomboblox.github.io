<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bomboblox Test Place</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial,Helvetica,sans-serif;color:#f1f1f1}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;background:rgba(17,17,17,.88);border-left:4px solid #ff6a00;padding:8px 14px;font-size:13px;line-height:1.55;min-width:210px;display:none}
#hud h1{margin:0 0 4px;font-size:15px;color:#ff6a00}
#hud .dot{display:inline-block;width:10px;height:10px;margin-right:6px}
#hud .hint{color:#aaa;margin-top:6px;font-size:12px}
#status{color:#999;font-size:12px}
#join{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:5}
#join .box{background:#1e1e1e;border:1px solid #ff6a00;padding:24px;width:300px;display:flex;flex-direction:column;gap:12px}
#join h2{margin:0;font-size:22px;color:#ff6a00}
#join input{height:38px;background:#111;border:1px solid #333;color:#f1f1f1;font-size:16px;padding:0 10px;outline:none}
#join input:focus{border-color:#ff6a00}
#join button{height:38px;background:#ff6a00;color:#111;border:0;font-weight:700;font-size:16px;cursor:pointer}
#join button:hover{background:#e05a00}
#join p{margin:0;font-size:12px;color:#999}
#hud{padding:6px 10px;min-width:0}
#menubtn{height:30px;padding:0 16px;background:#ff6a00;color:#111;border:0;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:4px}
#menubtn:hover{background:#e05a00}
.dot{display:inline-block;width:10px;height:10px;margin-right:6px}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:6}
#menu .mbox{background:#1e1e1e;border:1px solid #ff6a00;padding:20px;width:300px;display:flex;flex-direction:column;gap:10px}
#menu h2{margin:0;font-size:22px;color:#ff6a00}
#menu .hint{color:#aaa;font-size:12px;line-height:1.5}
#menu button{height:36px;border:0;font-weight:700;font-size:15px;cursor:pointer;background:#333;color:#f1f1f1}
#menu button:hover{background:#444}#menu button.pri{background:#ff6a00;color:#111}#menu button.pri:hover{background:#e05a00}#menu button.red{color:#ff5a5a}
#plist{font-size:14px;line-height:1.6;max-height:150px;overflow:auto}
#chat{position:fixed;left:10px;top:10px;width:340px;max-width:calc(100vw - 20px);display:none}
#clog{height:150px;overflow-y:auto;background:rgba(17,17,17,.6);padding:6px 8px;font-size:13px;line-height:1.45;word-break:break-word}
#cin{width:100%;box-sizing:border-box;height:30px;background:rgba(17,17,17,.9);border:1px solid #333;color:#f1f1f1;padding:0 8px;font-size:13px;outline:none}
#cin:focus{border-color:#ff6a00}
html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{touch-action:none}
#cin{-webkit-user-select:text;user-select:text}
#touchui{display:none}
body.touch.playing #touchui{display:block}
#joy{position:fixed;left:calc(28px + env(safe-area-inset-left));bottom:calc(28px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);touch-action:none;z-index:4}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(255,106,0,.85);pointer-events:none}
#jbtn{position:fixed;right:calc(32px + env(safe-area-inset-right));bottom:calc(44px + env(safe-area-inset-bottom));width:90px;height:90px;border-radius:50%;background:rgba(255,106,0,.8);color:#111;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:4;border:2px solid rgba(255,255,255,.5)}
#jbtn.on{background:#fff}
body.touch #chat{top:10px;bottom:auto;width:260px}
body.touch #clog{height:100px}
@media(max-height:480px){body.touch #clog{height:56px}}
#hud{left:auto;right:10px;top:10px;padding:0;min-width:0;background:none;border:0}
#menubtn{width:44px;height:44px;padding:0;margin:0;background:rgba(17,17,17,.88);border:2px solid #ff6a00;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
#menubtn:hover{background:#2a1608}
#menubtn span{display:block;width:22px;height:3px;background:#ff6a00}
#diag{color:#777;font-size:12px;line-height:1.5;border-top:1px solid #333;padding-top:8px}
#diag div:empty{display:none}
#mmtop{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(17,17,17,.88);border:2px solid #ff6a00;padding:8px 22px;font-size:18px;font-weight:700;z-index:3;display:none;white-space:nowrap;pointer-events:none}
#roleBox{position:fixed;left:0;right:0;top:28%;text-align:center;font-size:64px;font-weight:900;color:#fff;text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.8);z-index:8;display:none;pointer-events:none}
#resultBox{position:fixed;left:50%;top:32%;transform:translateX(-50%);background:rgba(17,17,17,.94);border:3px solid #ff6a00;padding:24px 44px;font-size:44px;font-weight:900;color:#fff;z-index:9;display:none;text-align:center;pointer-events:none}
#blackout{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .15s;z-index:7}
#blackout.on{opacity:1}
#xhair{position:fixed;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border:2px solid #fff;border-radius:50%;opacity:.85;display:none;pointer-events:none;z-index:3}
#toolbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:6px;z-index:3}
#tslot{position:relative;width:68px;height:68px;background:rgba(17,17,17,.88);border:2px solid #555;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center}
#tslot.on{border-color:#ff6a00;background:rgba(58,35,8,.92)}
#ticon{width:100%;height:100%;object-fit:contain;padding:6px;box-sizing:border-box}
#tlabel{font-weight:900;font-size:13px;color:#fff}
#tkey{position:absolute;top:2px;left:5px;font-size:12px;font-weight:700;color:#ccc}
#tcd{position:absolute;inset:0;background:rgba(0,0,0,.66);color:#fff;font-weight:900;font-size:24px;display:none;align-items:center;justify-content:center}
#thint{font-size:14px;font-weight:700;color:#fff;background:rgba(17,17,17,.85);padding:3px 10px;display:none}
#specbtn{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 24px;background:#ff6a00;color:#111;font-weight:700;cursor:pointer;display:none;z-index:3}
#specbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:none;align-items:center;gap:8px;background:rgba(17,17,17,.88);border:2px solid #ff6a00;padding:6px 10px;z-index:3;font-weight:700}
#specbar button{height:32px;min-width:36px;padding:0 10px;background:#333;color:#fff;border:0;font-weight:700;cursor:pointer}#specbar button:hover{background:#ff6a00;color:#111}
#spname{min-width:90px;text-align:center}
#abtn,#tbtn{position:fixed;display:none;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55);color:#fff;font-weight:900;font-size:13px;touch-action:none;z-index:4}
#abtn{width:76px;height:76px;right:calc(140px + env(safe-area-inset-right));bottom:calc(52px + env(safe-area-inset-bottom))}
#tbtn{width:64px;height:64px;right:calc(148px + env(safe-area-inset-right));bottom:calc(140px + env(safe-area-inset-bottom))}
body.touch.armed #abtn{display:flex}
body.touch.knife #tbtn{display:flex}
</style>
</head>

function hostEvent(sn) {

  var roles = mm.roles || {}, alive = copy(mm.alive), by = rk(e.by), tg = rk(e.target), up = {}, text = null;
  function dropGun(i) { var q = lastPos[i] || { x: 0, y: 0, z: 0 }; up.gun = { x: q.x, y: q.y + 1, z: q.z }; up.holder = null; }
  if (e.t === 'pickup') {

/* ---------- every player: reacting to the game state ---------- */
function onMM(cur) {

}
function roundStarted() {

  tool.equipped = true; tool.atkAt = 0; tool.throwUntil = 0; tool.gunUntil = 0;

}

}

}
function blackout(ms) { el('blackout').className = 'on'; clearTimeout(boTimer); boTimer = setTimeout(function() { el('blackout').className = ''; }, ms); }
function showResult(text) { var b = el('resultBox'); b.textContent = text; b.style.display = 'block'; clearTimeout(resTimer); resTimer = setTimeout(function() { b.style.display = 'none'; }, 4500); }

  var box = el('roleBox'), tok = ++roleToken, fin = role === 'murderer' ? 'Murderer' : role === 'sheriff' ? 'Sheriff' : 'Innocent';
  var col = { Murderer: '#ff4444', Sheriff: '#4aa8ff', Innocent: '#3ddc84' }, words = ['Innocent', 'Sheriff', 'Murderer'], t0 = performance.now(), last = '';
  box.style.display = 'block';

    if (t < 2300) { var w; do { w = words[Math.floor(Math.random() * 3)]; } while (w === last); last = w; box.innerHTML = 'Role: <span>' + w + '</span>'; setTimeout(tick, 60 + t * 0.1); }
    else if (t < 4200) { box.innerHTML = 'Role: <span style="color:' + col[fin] + '">' + fin + '</span>'; setTimeout(tick, 200); }

}

/* ---------- tools: knife (murderer) and gun (sheriff / whoever picks it up) ---------- */
function toolType() { if (!amAlive()) return null; if (myRole() === 'murderer') return 'knife'; return mm.holder === slot ? 'gun' : null; }
function curHeld() { if (!tool.type || !tool.equipped) return null; if (tool.type === 'knife' && performance.now() < tool.throwUntil) return null; return tool.type; }
function setTool(p, t) { p.tool = t; p.knifeM.visible = t === 'knife'; p.gunM.visible = t === 'gun'; }
function applyHand() { var h = curHeld(); if (me && me.tool !== h) setTool(me, h); }
function refreshTool() {
  var t = toolType();
  if (t !== tool.type) {
    tool.type = t; tool.equipped = true; tool.throwUntil = 0; tool.gunUntil = 0;
    var ic = el('ticon'), lb = el('tlabel');
    if (t) { ic.style.display = 'block'; lb.textContent = ''; ic.onerror = function() { ic.style.display = 'none'; lb.textContent = t === 'knife' ? 'KNIFE' : 'GUN'; }; ic.src = (t === 'knife' ? 'knifeicon.png' : 'gunicon.png') + '?v=1'; }
  }

}
function toggleEquip() { if (!tool.type || spec.on) return; tool.equipped = !tool.equipped; applyHand(); }
function lookDir() { return { x: -Math.sin(yaw) * Math.cos(pitch), y: -Math.sin(pitch), z: -Math.cos(yaw) * Math.cos(pitch) }; }
function swing() { me.atk = 0.3; myAc++; }
function nearestTarget(reach) {                                      /* someone you are basically touching, in front of you */
  var best = null, bd = 1e9;
  targets().forEach(function(i) {
    var g = remotes[i].g.position, dx = g.x - pos.x, dz = g.z - pos.z, d = Math.hypot(dx, dz);
    if (d > reach || Math.abs(g.y - pos.y) > 3.5) return;
    var ang = Math.atan2(dx, dz) - rot; ang = Math.abs(Math.atan2(Math.sin(ang), Math.cos(ang)));
    if (ang > 1.9 && d > 1.2) return;

}
function doAction() {
  if (!playing || menuOpen || typing || spec.on) return;
  var held = curHeld(); if (!held) return;
  var now = performance.now();
  if (held === 'knife') {
    if (now - tool.atkAt < STAB_CD) return; tool.atkAt = now; swing();
    var t = nearestTarget(STAB_REACH); if (t !== null) sendEv({ t: 'kill', target: t, w: 'knife' });
  } else {

  }
}
function wallDist(o, d, far) { var t = far; for (var i = 0; i < colliders.length; i++) { var h = rayBox(colliders[i], o[0], o[1], o[2], d.x, d.y, d.z); if (h < t) t = h; } return t; }
function segDist(p1, q1, p2, q2) {                                    /* closest distance between two segments; s = how far along the first one */
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; } function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }

  var d1 = sub(q1, p1), d2 = sub(q2, p2), r = sub(p1, p2), a = dot(d1, d1), e = dot(d2, d2), f = dot(d2, r), s, t;
  if (a <= 1e-9 && e <= 1e-9) return { d2: dot(r, r), s: 0 };
  if (a <= 1e-9) { s = 0; t = cl(f / e); }
  else {

    if (e <= 1e-9) { t = 0; s = cl(-c / a); }

function tracer(a, b) {

  m.position.set((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2); m.lookAt(b[0], b[1], b[2]); m.scale.z = len; scene.add(m); tracers.push({ m: m, until: performance.now() + 140 });
}
function shoot() {                                                   /* the bullet goes where the crosshair (screen centre) points */
  var o = [cam.position.x, cam.position.y, cam.position.z], d = lookDir(), tw = wallDist(o, d, 140), best = null, bt = tw;
  var far = [o[0] + d.x * tw, o[1] + d.y * tw, o[2] + d.z * tw];
  targets().forEach(function(i) {
    var g = remotes[i].g.position, r = segDist(o, far, [g.x, g.y + 0.3, g.z], [g.x, g.y + 5, g.z]);

  });

function makeKnifeMesh() {                                           /* built along the arm: the blade points the way the arm points */
  var g = new THREE.Group(), metal = new THREE.MeshStandardMaterial({ color: lin(0xd6dbe0), roughness: 0.3, metalness: 0.7 }), dark = new THREE.MeshStandardMaterial({ color: lin(0x2b2b2b), roughness: 0.8, metalness: 0 });
  function part(w, h, d, m, x, y, z) { var o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = true; g.add(o); }

}
function makeGunMesh() {

  function part(w, h, d, m, x, y, z) { var o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = true; g.add(o); }
  part(0.3, 0.9, 0.34, dark, 0, -2.3, 0); part(0.2, 0.9, 0.2, dark, 0, -3.1, 0.04); part(0.24, 0.3, 0.5, acc, 0, -2.0, -0.3);

}
function spawnKnife(o, d, mine) {
  var k = makeKnifeMesh(); k.position.y = 3.0;
  var kk = new THREE.Group(); kk.add(k); kk.position.set(o.x, o.y, o.z);
  kk.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), new THREE.Vector3(d.x, d.y, d.z)); scene.add(kk);

}
function doThrow() {
  if (!playing || menuOpen || typing || spec.on || !(tool.type === 'knife' && tool.equipped) || performance.now() < tool.throwUntil) return;
  tool.throwUntil = performance.now() + THROW_CD; swing();           /* the knife leaves your hand and you cannot use it for 3 seconds */
  var cd = lookDir(), co = [cam.position.x, cam.position.y, cam.position.z], tw = Math.min(70, wallDist(co, cd, 70));
  var o = { x: pos.x, y: pos.y + 3.4, z: pos.z }, aim = [co[0] + cd.x * tw, co[1] + cd.y * tw, co[2] + cd.z * tw];
  var dx = aim[0] - o.x, dy = aim[1] - o.y, dz = aim[2] - o.z, L = Math.hypot(dx, dy, dz) || 1, d = { x: dx / L, y: dy / L, z: dz / L };
  o.x += d.x * 1.5; o.y += d.y * 1.5; o.z += d.z * 1.5;
  spawnKnife(o, d, true); sendFx({ t: 'throw', x: o.x, y: o.y, z: o.z, dx: d.x, dy: d.y, dz: d.z });
}
function onFx(sn) {
  var e = sn.val(); if (!e || e.by === slot || srvNow() - (e.at || 0) > 3000) return;
  if (e.t === 'throw') spawnKnife({ x: e.x, y: e.y, z: e.z }, { x: e.dx, y: e.dy, z: e.dz }, false);
  else if (e.t === 'shot') tracer([e.x, e.y, e.z], [e.tx, e.ty, e.tz]);
}
function stepProjectiles(dt) {
  for (var k = projectiles.length - 1; k >= 0; k--) {
    var q = projectiles[k], step = 70 * dt, a = q.p, b = [a[0] + q.d[0] * step, a[1] + q.d[1] * step, a[2] + q.d[2] * step], dead = false;
    for (var i = 0; i < colliders.length && !dead; i++) if (rayBox(colliders[i], a[0], a[1], a[2], q.d[0], q.d[1], q.d[2]) <= step) dead = true;   /* walls stop it */
    if (q.mine && !dead) {
      var hit = null;
      targets().forEach(function(t) { var g = remotes[t].g.position; if (segDist(a, b, [g.x, g.y + 0.3, g.z], [g.x, g.y + 5, g.z]).d2 <= 1.4 * 1.4) hit = t; });
      if (hit !== null) { sendEv({ t: 'kill', target: hit, w: 'throw' }); dead = true; }

}

/* ---------- dropped gun: hovers with a green orb until a non-murderer walks into it ---------- */
function updateOrb() {
  if (mm.phase === 'round' && mm.gun) {
    if (!orb) {
      orb = new THREE.Group(); var gm = new THREE.Group(), gg = makeGunMesh(); gg.rotation.x = Math.PI / 2; gg.position.y = 2.6; gm.add(gg); orb.add(gm);
      orb.add(new THREE.Mesh(new THREE.SphereGeometry(1.7, 20, 14), new THREE.MeshBasicMaterial({ color: lin(0x3ddc84), transparent: true, opacity: 0.32, depthWrite: false })));
      orb.userData.gm = gm; scene.add(orb);
    }
    orb.userData.base = mm.gun.y + 1.5; orb.position.set(mm.gun.x, orb.userData.base, mm.gun.z);
  } else if (orb) { scene.remove(orb); orb = null; }
}
function mmFrame(dt) {
  applyHand(); stepProjectiles(dt);
  var now = performance.now();
  for (var i = tracers.length - 1; i >= 0; i--) if (now > tracers[i].until) { scene.remove(tracers[i].m); tracers.splice(i, 1); }
  if (orb) {
    orb.position.y = orb.userData.base + Math.sin(now / 500) * 0.3; orb.userData.gm.rotation.y = now / 700;
    if (amAlive() && myRole() !== 'murderer' && mm.holder !== slot && mm.gun && Math.hypot(pos.x - mm.gun.x, pos.z - mm.gun.z) < 3 && Math.abs(pos.y + 2 - mm.gun.y) < 4 && now - pickupAt > 1000) { pickupAt = now; sendEv({ t: 'pickup' }); }
  }
}

/* ---------- spectate (only for people in the lobby, only during a round) ---------- */
function specTarget() { var t = targets(); return t.length ? t[((spec.i % t.length) + t.length) % t.length] : null; }
el('specbtn').onclick = function() { if (targets().length) { spec.on = true; spec.i = 0; } };

/* ---------- on-screen text ---------- */

  if (!dbOK || !mm.endsAt || liveSlots().length < MIN_PLAYERS) return 'Waiting for players (need ' + MIN_PLAYERS + ')';

}

  top.textContent = mmText();

    if (cd > 0) { c.style.display = 'flex'; c.textContent = Math.ceil(cd / 1000); } else c.style.display = 'none';
    var h = el('thint'); h.style.display = held === 'knife' ? 'block' : 'none'; h.textContent = touchOn ? 'Tap THROW to throw' : 'T to throw';   /* shown while you hold the knife */
  }
  el('xhair').style.display = held === 'gun' ? 'block' : 'none';
  document.body.classList.toggle('armed', !!held); document.body.classList.toggle('knife', held === 'knife');
  el('abtn').textContent = held === 'gun' ? 'SHOOT' : 'STAB';
  el('specbtn').style.display = (mm.phase === 'round' && !amAlive() && !spec.on && targets().length > 0) ? 'block' : 'none';
  el('specbar').style.display = spec.on ? 'flex' : 'none';
  if (spec.on) { var st = specTarget(); el('spname').textContent = st !== null && remotes[st] ? remotes[st].name : '...'; }
}
setInterval(mmUI, 150);
el('tslot').onclick = toggleEquip;
el('abtn').addEventListener('pointerdown', function(e) { e.preventDefault(); doAction(); });
el('tbtn').addEventListener('pointerdown', function(e) { e.preventDefault(); doThrow(); });

/* ---------- join + main loop ---------- */
function join() {
  var n = document.getElementById('nm').value.trim().replace(/\s+/g, ' ').slice(0, 16);
  if (!n) { document.getElementById('nm').focus(); return; }
  try { localStorage.setItem('bb_game_name', n); } catch (e) {}
  document.getElementById('join').style.display = 'none';
  document.getElementById('hud').style.display = 'block'; document.getElementById('chat').style.display = 'block'; document.body.classList.add('playing');
  setStatus('Loading map...');
  mapReady.then(function() { me = makeAvatar(n, COLORS[0]); respawn(); playing = true; setStatus('Connecting...'); drawList(); connect(n); });
}
document.getElementById('go').onclick = join;
document.getElementById('nm').addEventListener('keydown', function(e) { if (e.key === 'Enter') join(); });

document.getElementById('nm').focus();

var last = performance.now();
(function loop(t) {

  var dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (me) { stepMe(dt); stepRemotes(dt); mmFrame(dt); }
  stepCam(dt); if (++lf % 8 === 0) updateLights(); fadeLights(dt); updateBubbles(); ren.render(scene, cam);
})(last);

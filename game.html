<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bomboblox Test Place</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial,Helvetica,sans-serif;color:#f1f1f1}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;background:rgba(17,17,17,.88);border-left:4px solid #ff6a00;padding:8px 14px;font-size:13px;line-height:1.55;min-width:210px;display:none}
#hud h1{margin:0 0 4px;font-size:15px;color:#ff6a00}
#hud .dot{display:inline-block;width:10px;height:10px;margin-right:6px}
#hud .hint{color:#aaa;margin-top:6px;font-size:12px}
#status{color:#999;font-size:12px}
#join{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:5}
#join .box{background:#1e1e1e;border:1px solid #ff6a00;padding:24px;width:300px;display:flex;flex-direction:column;gap:12px}
#join h2{margin:0;font-size:22px;color:#ff6a00}
#join input{height:38px;background:#111;border:1px solid #333;color:#f1f1f1;font-size:16px;padding:0 10px;outline:none}
#join input:focus{border-color:#ff6a00}
#join button{height:38px;background:#ff6a00;color:#111;border:0;font-weight:700;font-size:16px;cursor:pointer}
#join button:hover{background:#e05a00}
#join p{margin:0;font-size:12px;color:#999}
#hud{padding:6px 10px;min-width:0}
#menubtn{height:30px;padding:0 16px;background:#ff6a00;color:#111;border:0;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:4px}
#menubtn:hover{background:#e05a00}
.dot{display:inline-block;width:10px;height:10px;margin-right:6px}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:6}
#menu .mbox{background:#1e1e1e;border:1px solid #ff6a00;padding:20px;width:300px;display:flex;flex-direction:column;gap:10px}
#menu h2{margin:0;font-size:22px;color:#ff6a00}
#menu .hint{color:#aaa;font-size:12px;line-height:1.5}
#menu button{height:36px;border:0;font-weight:700;font-size:15px;cursor:pointer;background:#333;color:#f1f1f1}
#menu button:hover{background:#444}#menu button.pri{background:#ff6a00;color:#111}#menu button.pri:hover{background:#e05a00}#menu button.red{color:#ff5a5a}
#plist{font-size:14px;line-height:1.6;max-height:150px;overflow:auto}
#chat{position:fixed;left:10px;top:92px;width:340px;max-width:calc(100vw - 20px);display:none}
#clog{height:150px;overflow-y:auto;background:rgba(17,17,17,.6);padding:6px 8px;font-size:13px;line-height:1.45;word-break:break-word}
#cin{width:100%;box-sizing:border-box;height:30px;background:rgba(17,17,17,.9);border:1px solid #333;color:#f1f1f1;padding:0 8px;font-size:13px;outline:none}
#cin:focus{border-color:#ff6a00}
html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{touch-action:none}
#cin{-webkit-user-select:text;user-select:text}
#touchui{display:none}
body.touch.playing #touchui{display:block}
#joy{position:fixed;left:calc(28px + env(safe-area-inset-left));bottom:calc(28px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);touch-action:none;z-index:4}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(255,106,0,.85);pointer-events:none}
#jbtn{position:fixed;right:calc(32px + env(safe-area-inset-right));bottom:calc(44px + env(safe-area-inset-bottom));width:90px;height:90px;border-radius:50%;background:rgba(255,106,0,.8);color:#111;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:4;border:2px solid rgba(255,255,255,.5)}
#jbtn.on{background:#fff}
body.touch #chat{top:92px;bottom:auto;width:260px}
body.touch #clog{height:100px}
@media(max-height:480px){body.touch #clog{height:56px}}
</style>

<body>
<div id="hud"><button id="menubtn" type="button">Menu</button><div id="status">Starting...</div><div id="mapinfo" style="color:#999;font-size:12px"></div></div>

<div id="chat"><div id="clog"></div><input id="cin" maxlength="100" placeholder="Press Enter or / to chat" autocomplete="off"></div>

<div id="menu"><div class="mbox">
  <h2>Menu</h2>
  <div id="plist"></div>
  <div class="hint">WASD / arrows: move &middot; Space: jump<br>Hold mouse + drag: look &middot; Scroll: zoom<br>Enter or /: chat &middot; Esc: menu<br>V: first person (or scroll all the way in)</div>
  <button id="mres" class="pri" type="button">Resume</button>
  <button id="mfp" type="button">Switch to first person</button>
  <button id="mreset" type="button">Reset character</button>
  <button id="mleave" class="red" type="button">Leave game</button>
</div></div>

<div id="touchui"><div id="joy"><div id="knob"></div></div><div id="jbtn">JUMP</div></div>

<div id="join"><div class="box">
  <h2>Enter ur name</h2>
  <input id="nm" maxlength="16" placeholder="Ur noob name" autocomplete="off">
  <button id="go" type="button">Join</button>
  <p>Up to 5 players at once.</p>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
/* ================= SETUP (multiplayer only) =================
   Firebase > Build > Realtime Database > Create database. Copy the URL shown at the top of the Data tab
   and paste it below. Examples:
     Belgium (europe-west1): https://bomboblox-default-rtdb.europe-west1.firebasedatabase.app
     United States:          https://bomboblox-default-rtdb.firebaseio.com
   Rules tab (then Publish):  { "rules": { "game": { ".read": true, ".write": true } } }
   Without this the game still works, but only for you (solo). */
var DB_URL = 'https://bomboblox-default-rtdb.europe-west1.firebasedatabase.app';
var CFG = { apiKey: "AIzaSyA1yGuSQ1sK5_oESRyTmfV_q5i6ZiLhdt0", authDomain: "bomboblox.firebaseapp.com", projectId: "bomboblox", databaseURL: DB_URL, appId: "1:213718036243:web:ab59b8145667ed764a74e6" };

var MAX = 5, COLORS = [0xe53935, 0x1e88e5, 0x43a047, 0xfdd835, 0x8e24aa];
var WALK = 16, JUMP = 53.15, GRAV = 196.2, LIMIT = 250;   /* roblox-like: 16 studs/s, jump height 7.2 studs */

/* ---------- scene ---------- */
function lin(h) { return new THREE.Color(h).convertSRGBToLinear(); }          /* colors written as normal hex -> correct linear colors */
function ctex(c) { var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; }
var scene = new THREE.Scene();
scene.background = lin(0xd6e8f6);
scene.fog = new THREE.Fog(lin(0xd6e8f6), 170, 460);
var cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 1000);
var ren = new THREE.WebGLRenderer({ antialias: true });
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
ren.outputEncoding = THREE.sRGBEncoding;
ren.shadowMap.enabled = true; ren.shadowMap.type = THREE.PCFSoftShadowMap;
ren.setSize(innerWidth, innerHeight);
document.body.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(lin(0xbfdcff), lin(0x75705f), 0.5));                    /* sky light from above, warm bounce from below */
var sun = new THREE.DirectionalLight(lin(0xfff1d6), 0.85); sun.position.set(60, 100, 40); scene.add(sun); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.35;
var sc = sun.shadow.camera; sc.left = -45; sc.right = 45; sc.top = 45; sc.bottom = -45; sc.near = 1; sc.far = 320;   /* shadow box follows the player */
var fill = new THREE.DirectionalLight(lin(0xaec8ff), 0.22); fill.position.set(-50, 40, -60); scene.add(fill);
var sky = (function() {                                                                       /* sky dome: deep blue on top, pale at the horizon */
  var c = document.createElement('canvas'); c.width = 2; c.height = 256; var x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#3a74cc'); g.addColorStop(0.28, '#6aa5e6'); g.addColorStop(0.5, '#d6e8f6'); g.addColorStop(1, '#d6e8f6'); x.fillStyle = g; x.fillRect(0, 0, 2, 256);
  var m = new THREE.Mesh(new THREE.SphereGeometry(900, 24, 16), new THREE.MeshBasicMaterial({ map: ctex(c), side: THREE.BackSide, fog: false, depthWrite: false }));
  m.renderOrder = -1; scene.add(m); return m;
})();
var base = new THREE.Mesh(new THREE.PlaneGeometry(512, 512), new THREE.MeshLambertMaterial({ color: lin(0x8d8d8d) }));
base.rotation.x = -Math.PI / 2; base.receiveShadow = true; scene.add(base);
var grid = new THREE.GridHelper(512, 128, lin(0x7a7a7a), lin(0x7a7a7a)); grid.position.y = 0.02; scene.add(grid);   /* 1 square = 4 studs */

/* ---------- blocky avatar (roblox proportions: legs 2, torso 2, head ~1, arms 2) ---------- */
function box(w, h, d, c, x, y, z) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: c }));
  m.position.set(x, y, z); return m;
}
function nameTag(name) {
  var c = document.createElement('canvas'); c.width = 256; c.height = 64;
  var x = c.getContext('2d'); x.font = 'bold 30px Arial'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineWidth = 6; x.strokeStyle = 'rgba(0,0,0,.85)'; x.strokeText(name, 128, 32); x.fillStyle = '#fff'; x.fillText(name, 128, 32);
  var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: ctex(c), depthTest: true, depthWrite: false, transparent: true }));
  s.scale.set(5, 1.25, 1); s.position.set(0, 6.7, 0); s.renderOrder = 10; return s;
}
var GEOS = {}, HEADG = null, FACE = null;
function bevelGeo(w, h, d, r) {                    /* a box whose edges and corners are beveled by r */
  var key = [w, h, d, r].join('_'); if (GEOS[key]) return GEOS[key];
  var g = new THREE.BoxGeometry(w, h, d, 4, 4, 4), p = g.attributes.position, H = [w / 2, h / 2, d / 2];
  function remap(t, half) { var u = Math.abs(t) / half, sg = t < 0 ? -1 : 1; return u > 0.99 ? sg * half : u > 0.4 ? sg * (half - r) : 0; }
  for (var i = 0; i < p.count; i++) {
    var P = [remap(p.getX(i), H[0]), remap(p.getY(i), H[1]), remap(p.getZ(i), H[2])], C = [], n = [], L = 0, a;
    for (a = 0; a < 3; a++) { C[a] = Math.max(-(H[a] - r), Math.min(H[a] - r, P[a])); n[a] = P[a] - C[a]; L += Math.abs(n[a]); }
    if (L > 1e-12) { for (a = 0; a < 3; a++) P[a] = C[a] + n[a] / L * r; }
    p.setXYZ(i, P[0], P[1], P[2]);
  }
  g.computeVertexNormals(); return (GEOS[key] = g);
}
function bbox(w, h, d, c, x, y, z) {
  var m = new THREE.Mesh(bevelGeo(w, h, d, 0.16), new THREE.MeshStandardMaterial({ color: lin(c), roughness: 0.8, metalness: 0 }));
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m;
}
function headGeo() {                                /* roblox head: a short cylinder with a rounded top and a small bevel underneath */
  if (HEADG) return HEADG;
  var R = 0.62, Hh = 1.2, t = 0.22, b = 0.2, pts = [new THREE.Vector2(0, -Hh / 2)], i, a;
  for (i = 0; i <= 4; i++) { a = i / 4 * Math.PI / 2; pts.push(new THREE.Vector2(R - b + Math.sin(a) * b, -Hh / 2 + b - Math.cos(a) * b)); }
  for (i = 0; i <= 8; i++) { a = i / 8 * Math.PI / 2; pts.push(new THREE.Vector2(R - t + Math.cos(a) * t, Hh / 2 - t + Math.sin(a) * t)); }
  pts.push(new THREE.Vector2(0, Hh / 2));
  return (HEADG = new THREE.LatheGeometry(pts, 32));
}
function makeHead() {
  var g = new THREE.Group(), R = 0.62, fh = 0.78, fy = -0.01;     /* the face lives on the straight part of the head */
  var head = new THREE.Mesh(headGeo(), new THREE.MeshStandardMaterial({ color: lin(0xf5cd30), roughness: 0.7, metalness: 0 }));
  head.castShadow = true; head.receiveShadow = true; g.add(head);
  if (FACE) {                                                   /* bomboface.png wrapped around the front of the head */
    var asp = FACE.image && FACE.image.height ? FACE.image.width / FACE.image.height : 1, th = Math.min(2.2, fh * asp / R);
    var fm = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.006, R + 0.006, fh, 32, 1, true, -th / 2, th), new THREE.MeshLambertMaterial({ map: FACE, transparent: true }));
    fm.position.y = fy; g.add(fm);
  } else {                                                      /* no bomboface.png found: simple face */
    var dk = new THREE.MeshBasicMaterial({ color: lin(0x111111) });
    [[-0.26, 0.1, 0.18, 0.25], [0.26, 0.1, 0.18, 0.25], [0, -0.22, 0.4, 0.08]].forEach(function(f) {
      var m = new THREE.Mesh(new THREE.BoxGeometry(f[2], f[3], 0.05), dk); m.position.set(f[0], f[1], Math.sqrt(R * R - f[0] * f[0]) + 0.01); g.add(m);
    });
  }
  g.position.y = 4.6; return g;
}
function makeAvatar(name, color) {
  var g = new THREE.Group(), inner = new THREE.Group(); g.add(inner);
  var torso = bbox(2, 2, 1, color, 0, 3, 0); inner.add(torso);
  inner.add(makeHead());
  function limb(c, x, y) { var p = new THREE.Group(); p.position.set(x, y, 0); p.add(bbox(1, 2, 1, c, 0, -1, 0)); inner.add(p); return p; }
  var p = { g: g, inner: inner, torso: torso, aL: limb(0xf5cd30, -1.5, 4), aR: limb(0xf5cd30, 1.5, 4), lL: limb(0xa3c76d, -0.5, 2), lR: limb(0xa3c76d, 0.5, 2), amp: 0, ph: 0, name: name };
  g.add(nameTag(name));
  p.shadow = new THREE.Mesh(new THREE.CircleGeometry(1.3, 20), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 }));
  p.shadow.rotation.x = -Math.PI / 2; p.shadow.position.y = 0.04;
  p.shadow.visible = false; scene.add(g); scene.add(p.shadow); return p;
}
function animate(p, dt, moving, y) {
  p.amp += ((moving ? 0.9 : 0) - p.amp) * Math.min(1, dt * 12);
  if (moving) p.ph += dt * 11;
  var s = Math.sin(p.ph) * p.amp;
  p.aL.rotation.x = s; p.aR.rotation.x = -s; p.lL.rotation.x = -s; p.lR.rotation.x = s;
  p.shadow.position.x = p.g.position.x; p.shadow.position.z = p.g.position.z;
  var k = 1 / (1 + y * 0.12); p.shadow.scale.set(k, k, 1); p.shadow.material.opacity = 0.35 * k;
}
function removeAvatar(p) { scene.remove(p.g); scene.remove(p.shadow); }

/* ---------- me ---------- */
var me = null, pos = { x: 0, y: 0, z: 0 }, vy = 0, onGround = true, rot = 0;
var yaw = 0, pitch = 0.45, dist = 16;
var keys = {}, playing = false;
var typing = false, menuOpen = false;
addEventListener('keydown', function(e) {
  if (!playing) return;
  if (e.code === 'Escape') { e.preventDefault(); if (typing) document.getElementById('cin').blur(); else toggleMenu(); return; }
  if (typing) return;
  if (!menuOpen && (e.code === 'Enter' || e.key === '/')) { e.preventDefault(); document.getElementById('cin').focus(); return; }
  if (menuOpen) return;
  if (e.code === 'KeyV') { toggleFP(); return; }
  keys[e.code] = true; if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
});
addEventListener('keyup', function(e) { keys[e.code] = false; });
addEventListener('blur', function() { keys = {}; });
var ptrs = {}, lastPinch = 0, cv = ren.domElement;
cv.addEventListener('pointerdown', function(e) { ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }; lastPinch = 0; try { cv.setPointerCapture(e.pointerId); } catch (x) {} });
function pEnd(e) { delete ptrs[e.pointerId]; lastPinch = 0; }
cv.addEventListener('pointerup', pEnd); cv.addEventListener('pointercancel', pEnd);
cv.addEventListener('pointermove', function(e) {
  var p = ptrs[e.pointerId]; if (!p) return;
  var ids = Object.keys(ptrs);
  if (ids.length >= 2) {                                     /* two fingers: pinch to zoom */
    p.x = e.clientX; p.y = e.clientY; var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastPinch) dist = Math.max(0.5, Math.min(45, dist - (d - lastPinch) * 0.06)); lastPinch = d; return;
  }
  var k = e.pointerType === 'touch' ? 0.009 : 0.006;
  yaw -= (e.clientX - p.x) * k; pitch = Math.max(dist <= 1 ? -1.45 : 0.05, Math.min(1.45, pitch + (e.clientY - p.y) * k)); p.x = e.clientX; p.y = e.clientY;
});
cv.addEventListener('wheel', function(e) { e.preventDefault(); dist = Math.max(0.5, Math.min(45, dist + e.deltaY * 0.02)); }, { passive: false });
cv.addEventListener('contextmenu', function(e) { e.preventDefault(); });
addEventListener('resize', function() { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth, innerHeight); });

function stepMe(dt) {
  var f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  var r = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  f += joy.f; r += joy.r;
  var mag = Math.min(1, Math.hypot(f, r)), moving = mag > 0.12;
  if (moving) {
    var fx = -Math.sin(yaw), fz = -Math.cos(yaw);          /* camera forward on the ground */
    var dx = fx * f + (-fz) * r, dz = fz * f + fx * r, len = Math.hypot(dx, dz);
    dx /= len; dz /= len;
    pos.x += dx * WALK * mag * dt; pos.z += dz * WALK * mag * dt;
    var d = Math.atan2(dx, dz) - rot; d = Math.atan2(Math.sin(d), Math.cos(d));
    rot += d * Math.min(1, dt * 14);
  }
  pushOut();
  if (keys.Space && onGround) { vy = JUMP; onGround = false; }
  var py = pos.y, v0 = vy; vy -= GRAV * dt; pos.y += (v0 + vy) / 2 * dt;      /* exact for constant gravity */
  vertical(py);
  if (!hasMap) { pos.x = Math.max(-LIMIT, Math.min(LIMIT, pos.x)); pos.z = Math.max(-LIMIT, Math.min(LIMIT, pos.z)); }
  if (pos.y < -200) respawn();
  me.g.position.set(pos.x, pos.y, pos.z); me.inner.rotation.y = rot;
  animate(me, dt, moving && onGround, pos.y);
}
var camD = 16, fp = false;
function rayBox(c, ox, oy, oz, dx, dy, dz) {      /* distance along the ray to where it enters this part, or Infinity */
  var cy = (c.bot + c.top) / 2, rx = ox - c.x, rz = oz - c.z;
  var o = [c.cs * rx - c.sn * rz, oy - cy, c.sn * rx + c.cs * rz], d = [c.cs * dx - c.sn * dz, dy, c.sn * dx + c.cs * dz], h = [c.hx, (c.top - c.bot) / 2, c.hz];
  var tmin = -Infinity, tmax = Infinity;
  for (var a = 0; a < 3; a++) {
    if (Math.abs(d[a]) < 1e-9) { if (Math.abs(o[a]) > h[a]) return Infinity; }
    else { var t1 = (-h[a] - o[a]) / d[a], t2 = (h[a] - o[a]) / d[a]; if (t1 > t2) { var q = t1; t1 = t2; t2 = q; } if (t1 > tmin) tmin = t1; if (t2 < tmax) tmax = t2; if (tmin > tmax) return Infinity; }
  }
  return tmin >= 0 ? tmin : Infinity;
}
function stepCam(dt) {
  var tx = pos.x, ty = pos.y + 4, tz = pos.z;
  var dx = Math.sin(yaw) * Math.cos(pitch), dy = Math.sin(pitch), dz = Math.cos(yaw) * Math.cos(pitch), allowed = dist;
  fp = dist <= 1; if (me) me.g.visible = !fp;                       /* first person: camera in the head, your avatar is hidden */
  if (fp) {
    var ey = pos.y + 4.7; cam.position.set(tx, ey, tz); cam.lookAt(tx - dx, ey - dy, tz - dz);
    sun.position.set(tx + 60, ty + 100, tz + 40); sun.target.position.set(tx, ty - 4, tz); sky.position.copy(cam.position); return;
  }
  if (hasMap) for (var i = 0; i < colliders.length; i++) { var t = rayBox(colliders[i], tx, ty, tz, dx, dy, dz); if (t < allowed) allowed = t; }
  allowed = Math.max(1.2, allowed - 0.5);                          /* stop just in front of the wall */
  if (allowed < camD) camD = allowed; else camD += (allowed - camD) * Math.min(1, (dt || 0.016) * 6);
  cam.position.set(tx + dx * camD, Math.max(0.6, ty + dy * camD), tz + dz * camD);
  cam.lookAt(tx, ty, tz);
  sun.position.set(tx + 60, ty + 100, tz + 40); sun.target.position.set(tx, ty - 4, tz); sky.position.copy(cam.position);
}

/* ---------- multiplayer (Firebase Realtime Database) ---------- */
var slot = -1, sref = null, remotes = {}, dbOK = false, sent = { x: 1e9, y: 0, z: 0, r: 0, t: 0 };
function setStatus(t) { document.getElementById('status').textContent = t; }
function drawList() {
  var h = '<span class="dot" style="background:#' + COLORS[Math.max(slot, 0)].toString(16).padStart(6, '0') + '"></span><b>' + esc(me.name) + '</b> (you)';
  Object.keys(remotes).forEach(function(i) { h += '<br><span class="dot" style="background:#' + COLORS[i].toString(16).padStart(6, '0') + '"></span>' + esc(remotes[i].name); });
  document.getElementById('plist').innerHTML = h;

function toggleFP() { dist = dist <= 1 ? 12 : 0.5; camD = dist; if (dist > 1) pitch = Math.max(pitch, 0.05); }
function toggleMenu() {
  menuOpen = !menuOpen; document.getElementById('mfp').textContent = dist <= 1 ? 'Switch to third person' : 'Switch to first person'; keys = {}; joyEnd(); jbEnd();
  document.getElementById('menu').style.display = menuOpen ? 'flex' : 'none';
}
function leave() {
  var go = function() { location.href = 'index.html'; };
  if (sref) {
    var p = sref.remove();
    if (!Object.keys(remotes).length && chatRef) p = p.then(function() { return chatRef.remove(); });   /* last one out clears the chat */
    p.then(go, go); setTimeout(go, 1200);
  } else go();
}
document.getElementById('menubtn').onclick = toggleMenu;
document.getElementById('mres').onclick = toggleMenu;
document.getElementById('mfp').onclick = function() { toggleFP(); toggleMenu(); };
document.getElementById('mreset').onclick = function() { respawn(); toggleMenu(); };
document.getElementById('mleave').onclick = leave;

/* ---------- chat (bubbles + history panel), shared through game/chat in the Realtime Database ---------- */
var CHATCOL = ['#ff6b66', '#5bb5ff', '#6fdc6f', '#ffe14d', '#d27cf0'], chatReady = true, chatRef = null, lastChat = 0;
function bubbleSprite(text) {
  var c = document.createElement('canvas'), x = c.getContext('2d'), F = 'bold 26px Arial';
  x.font = F; var words = text.replace(/(\S{16})/g, '$1 ').split(' '), lines = [], cur = '';
  words.forEach(function(w) { var t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > 300 && cur) { lines.push(cur); cur = w; } else cur = t; });
  lines.push(cur); lines = lines.slice(0, 4);
  var wm = 0; lines.forEach(function(l) { wm = Math.max(wm, x.measureText(l).width); });
  var W = Math.ceil(wm) + 28, H = lines.length * 32 + 22, T = 14; c.width = W; c.height = H + T; x = c.getContext('2d'); x.font = F;
  x.fillStyle = '#fff'; x.strokeStyle = 'rgba(0,0,0,.6)'; x.lineWidth = 3; x.beginPath();
  var r = 10; x.moveTo(r, 2); x.arcTo(W - 2, 2, W - 2, H, r); x.arcTo(W - 2, H, W / 2 + 10, H, r); x.lineTo(W / 2 + 10, H); x.lineTo(W / 2, H + T - 2); x.lineTo(W / 2 - 10, H); x.arcTo(2, H, 2, 2, r); x.arcTo(2, 2, W - 2, 2, r); x.closePath(); x.fill(); x.stroke();
  x.fillStyle = '#111'; x.textBaseline = 'middle'; lines.forEach(function(l, i) { x.fillText(l, 14, 11 + 16 + i * 32); });
  var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: ctex(c), depthTest: true, depthWrite: false, transparent: true }));
  s.scale.set(W / 40, (H + T) / 40, 1); s.center.set(0.5, 0); s.position.set(0, 7.4, 0); s.renderOrder = 11; return s;
}
function clearBubble(p) { if (p.bub) { p.g.remove(p.bub); p.bub.material.map.dispose(); p.bub.material.dispose(); p.bub = null; } }
function setBubble(p, text) { clearBubble(p); p.bub = bubbleSprite(text); p.bubUntil = Date.now() + 7000; p.g.add(p.bub); }
function updateBubbles() {
  var now = Date.now(), list = me ? [me] : [];
  Object.keys(remotes).forEach(function(i) { list.push(remotes[i]); });
  list.forEach(function(p) { if (p.bub && now > p.bubUntil) clearBubble(p); });
}
function onChat(m, bubble) {
  var log = document.getElementById('clog'), near = log.scrollHeight - log.scrollTop - log.clientHeight < 40, d = document.createElement('div');
  d.innerHTML = '<b style="color:' + (CHATCOL[m.s] || '#ff6a00') + '">' + esc(m.n) + '</b>: ' + esc(m.t);
  log.appendChild(d); while (log.childNodes.length > 120) log.removeChild(log.firstChild);
  if (near) log.scrollTop = log.scrollHeight;
  if (bubble) { var p = (m.s === slot) ? me : remotes[m.s]; if (p) setBubble(p, m.t); }
}
function sendChat(text) {
  text = text.replace(/\s+/g, ' ').trim().slice(0, 100);
  if (!text || Date.now() - lastChat < 800) return; lastChat = Date.now();
  var m = { n: me.name, s: slot, t: text };
  if (chatRef && dbOK) chatRef.push({ n: m.n, s: m.s, t: m.t, at: firebase.database.ServerValue.TIMESTAMP }).catch(function() { onChat(m, true); });
  else onChat(m, true);                                              /* solo mode: only you see it */
}
function startChat(db) {
  chatRef = db.ref('game/chat'); chatReady = false; var q = chatRef.limitToLast(50);
  q.on('child_added', function(sn) {
    var m = sn.val(); if (!m || typeof m.t !== 'string') return;
    onChat({ n: String(m.n || '?').slice(0, 16), s: typeof m.s === 'number' ? m.s : -1, t: m.t.slice(0, 100) }, chatReady);
  });
  q.once('value', function() { chatReady = true; });
}
var cin = document.getElementById('cin');
cin.addEventListener('focus', function() { typing = true; keys = {}; });
cin.addEventListener('blur', function() { typing = false; });
cin.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.stopPropagation(); sendChat(cin.value); cin.value = ''; cin.blur(); } });

/* ---------- touch controls (phone / tablet) ---------- */
var joy = { f: 0, r: 0 }, joyId = null, touchOn = false;
var joyEl = document.getElementById('joy'), knob = document.getElementById('knob'), jb = document.getElementById('jbtn');
function joyMove(e) {
  var b = joyEl.getBoundingClientRect(), R = 45, dx = e.clientX - (b.left + b.width / 2), dy = e.clientY - (b.top + b.height / 2), d = Math.hypot(dx, dy);
  if (d > R) { dx = dx / d * R; dy = dy / d * R; }
  knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; joy.r = dx / R; joy.f = -dy / R;
}
function joyEnd() { joyId = null; joy.f = 0; joy.r = 0; knob.style.transform = ''; }
joyEl.addEventListener('pointerdown', function(e) { e.preventDefault(); joyId = e.pointerId; try { joyEl.setPointerCapture(e.pointerId); } catch (x) {} joyMove(e); });
joyEl.addEventListener('pointermove', function(e) { if (e.pointerId === joyId) joyMove(e); });
joyEl.addEventListener('pointerup', function(e) { if (e.pointerId === joyId) joyEnd(); });
joyEl.addEventListener('pointercancel', joyEnd);
function jbEnd() { keys.Space = false; jb.classList.remove('on'); }
jb.addEventListener('pointerdown', function(e) { e.preventDefault(); try { jb.setPointerCapture(e.pointerId); } catch (x) {} keys.Space = true; jb.classList.add('on'); });
jb.addEventListener('pointerup', jbEnd); jb.addEventListener('pointercancel', jbEnd);
function enableTouch() {
  if (touchOn) return; touchOn = true; document.body.classList.add('touch');
  document.querySelector('#menu .hint').innerHTML = 'Left stick: move &middot; JUMP button: jump<br>Drag the screen: look &middot; Pinch: zoom<br>Pinch all the way in: first person';
  document.getElementById('cin').placeholder = 'Tap here to chat';
}
if (window.matchMedia && matchMedia('(pointer: coarse)').matches) enableTouch();
addEventListener('touchstart', enableTouch, { once: true, passive: true });

/* ---------- join + main loop ---------- */
function join() {
  var n = document.getElementById('nm').value.trim().replace(/\s+/g, ' ').slice(0, 16);
  if (!n) { document.getElementById('nm').focus(); return; }
  try { localStorage.setItem('bb_game_name', n); } catch (e) {}
  document.getElementById('join').style.display = 'none';
  document.getElementById('hud').style.display = 'block'; document.getElementById('chat').style.display = 'block'; document.body.classList.add('playing');
  setStatus('Loading map...');
  mapReady.then(function() { me = makeAvatar(n, COLORS[0]); respawn(); playing = true; setStatus('Connecting...'); drawList(); connect(n); });
}
document.getElementById('go').onclick = join;
document.getElementById('nm').addEventListener('keydown', function(e) { if (e.key === 'Enter') join(); });
try { document.getElementById('nm').value = localStorage.getItem('bb_game_name') || ''; } catch (e) {}
document.getElementById('nm').focus();

var last = performance.now();
(function loop(t) {
  requestAnimationFrame(loop);
  var dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (me) { stepMe(dt); stepRemotes(dt); }
  stepCam(dt); if (++lf % 8 === 0) updateLights(); fadeLights(dt); updateBubbles(); ren.render(scene, cam);
})(last);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends - Bomboblox</title>
<link rel="icon" type="image/png" href="bomboblox.png">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
#tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid #2b2638}
.tab{padding:10px 18px;font:900 14px Rubik,sans-serif;color:#aaa;background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}.tab:hover{color:#ff8c1a}.tab.on{color:#ff8c1a;border-bottom-color:#ff8c1a}
.tab .n{background:#ff2b2b;color:#fff;font-size:11px;padding:1px 6px;border-radius:9px;margin-left:5px}
.pane{display:none;flex-direction:column;gap:14px}.pane.on{display:flex}
#findbar{display:flex;gap:8px}#findbar .txt{flex:1}
.prow{display:flex;align-items:center;gap:12px;background:#201c2b;border:2px solid #2b2638;padding:10px 14px}.prow:hover{border-color:#ff8c1a}
.prow .pn{flex:1;min-width:0}.prow .pn a{font-size:15px;font-weight:900;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prow .pn small{font-size:11px;color:#777}
</style>
</head>
<body>
<div id="topbar"><a href="index.html" id="logo"></a><div id="auth-area"><a href="login.html" class="auth-btn" id="btn-login">Log In</a><a href="signup.html" class="auth-btn" id="btn-signup">Sign Up</a></div></div>
<main>
  <nav id="tabs">
    <button class="tab on" data-t="mine">My Friends <span id="c-mine"></span></button>
    <button class="tab" data-t="req">Requests <span id="c-req"></span></button>
    <button class="tab" data-t="find">Find People</button>
  </nav>

  <section class="pane on" id="p-mine"><div class="friend-grid" id="friends"><div class="empty">Loading...</div></div></section>
  <section class="pane" id="p-req"><div class="card" id="reqs"><div class="empty">Loading...</div></div></section>
  <section class="pane" id="p-find">
    <form id="findbar"><input class="txt" id="q" maxlength="30" placeholder="Type a name (or the start of one)..." autocomplete="off"><button class="btn" type="submit">Search</button></form>
    <div id="results" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>
</main>
<footer>&copy; Bomboblox. A fan-made game platform, not affiliated with Roblox.</footer>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="bb.js"></script>
<script>
  var $ = function(i) { return document.getElementById(i); }, me = null;
  function tab(t) {
    document.querySelectorAll('.tab').forEach(function(b) { b.classList.toggle('on', b.dataset.t === t); });
    document.querySelectorAll('.pane').forEach(function(p) { p.classList.toggle('on', p.id === 'p-' + t); });
    if (t === 'find' && !$('results').dataset.done) { $('results').dataset.done = 1; search(); }
  }
  document.querySelectorAll('.tab').forEach(function(b) { b.onclick = function() { tab(b.dataset.t); }; });
  $('reqs').addEventListener('click', bbReqClick);

  function search() {
    var q = $('q').value.trim().toLowerCase(), col = db.collection('users'), r = $('results');
    r.innerHTML = '<div class="empty">Searching...</div>';
    var query = q ? col.orderBy('usernameLower').startAt(q).endAt(q + '\uf8ff').limit(24) : col.orderBy('createdAt', 'desc').limit(24);
    query.get().then(function(s) {
      var rows = s.docs.filter(function(d) { return d.id !== me.uid; });
      r.innerHTML = rows.length ? rows.map(function(d) {
        var x = d.data();
        return '<div class="prow">' + bbAvU(d.id, x.username, 48, 'user.html?uid=' + encodeURIComponent(d.id)) + '<div class="pn"><a href="user.html?uid=' + encodeURIComponent(d.id) + '">' + esc(x.username) + '</a><small>Joined ' + bbDate(x.createdAt) + '</small></div>' + bbFBtn(d.id, x.username) + '</div>';
      }).join('') : '<div class="empty">Nobody found. Check the spelling?</div>';
      bbFBtnFill(r);
    }).catch(function(e) { r.innerHTML = '<div class="empty">Could not search: ' + esc(e.message) + '</div>'; });
  }
  $('findbar').onsubmit = function(e) { e.preventDefault(); search(); };
  $('results').addEventListener('click', function(e) { bbFBtnClick(e); });

  auth.onAuthStateChanged(function(u) {
    if (!u) return location.href = 'login.html';
    me = u; bbNav(u);
    var p = new URLSearchParams(location.search);
    if (p.get('q')) $('q').value = p.get('q');
    tab(p.get('tab') || 'mine');
    var U = db.collection('users').doc(u.uid);
    U.collection('friends').orderBy('at', 'desc').limit(200).onSnapshot(function(q) {
      $('c-mine').textContent = '(' + q.docs.length + ')';
      $('friends').innerHTML = q.docs.length ? q.docs.map(function(d) { return bbFriendTile(d.id, d.data()); }).join('') : '<div class="empty" style="grid-column:1/-1">No friends yet. Use the Find People tab!</div>';
    }, function(e) { $('friends').innerHTML = '<div class="empty">Error: ' + esc(e.message) + '</div>'; });
    U.collection('friendReqs').orderBy('at', 'desc').limit(50).onSnapshot(function(q) {
      var n = q.docs.length;
      $('c-req').innerHTML = n ? '<span class="n">' + n + '</span>' : '';
      $('reqs').innerHTML = n ? q.docs.map(function(d) { return bbReqRow(d.id, d.data()); }).join('') : '<div class="empty">No friend requests right now.</div>';
    }, function() {});
  });
</script>
</body>
</html>
